<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <title>New Word &dash; English Words</title>
</head>
<body>
<h1>New Word</h1>
<a data-th-href="@{/catalogue/words/list}">&larr; The common word list</a>
<form method="post" data-th-action="@{/catalogue/words/create}"
class="center-form">
    <label>
        Word<br>
        <input type="text" name="word">
    </label><br>
    <label>
        Definition<br>
        <input type="text" name="definition">
    </label><br>
    <label>
        Note<br>
        <input type="text" name="note">
    </label><br>
    <button type="submit">Save</button>
</form>
</body>
</html>
